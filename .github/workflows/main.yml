name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

jobs:
  tests:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            tox-env: py310-test
          - python-version: "3.11"
            tox-env: py311-test
          - python-version: "3.12"
            tox-env: py312-test
          - python-version: "3.13"
            tox-env: py313-test
          - python-version: "3.14"
            tox-env: py314-test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from tags, which a shallow
          # checkout does not fetch.
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tox
        run: python -m pip install tox

      - name: Run tox
        env:
          TOX_PARALLEL_NO_SPINNER: 1
        run: tox -e ${{ matrix.tox-env }}

  interop:
    # Runs this client and python-ldap side by side against a real slapd, so
    # a difference between the two shows up as a failing test.
    name: python-ldap interop
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from tags, which a shallow
          # checkout does not fetch.
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install slapd and what python-ldap builds against
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            slapd ldap-utils libldap2-dev libsasl2-dev

      - name: Let slapd run from the directory the tests give it
        run: |
          # The packaged service holds the standard config, and its AppArmor
          # profile only allows that one; the tests start their own.
          sudo systemctl stop slapd || true
          sudo systemctl disable slapd || true
          if [ -f /etc/apparmor.d/usr.sbin.slapd ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.slapd || true
          fi

      - name: Install tox
        run: python -m pip install tox

      - name: Run the interop tests
        env:
          SLAPD: /usr/sbin/slapd
        run: tox -e interop

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from tags, which a shallow
          # checkout does not fetch.
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tox
        run: python -m pip install tox

      - name: Run linters
        run: tox -e py312-linters

  mypy:
    # What mypy concludes depends on the version it is checking for, so it
    # runs under each of them.
    name: mypy py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            tox-env: py310-mypy
          - python-version: "3.11"
            tox-env: py311-mypy
          - python-version: "3.12"
            tox-env: py312-mypy
          - python-version: "3.13"
            tox-env: py313-mypy
          - python-version: "3.14"
            tox-env: py314-mypy

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from tags, which a shallow
          # checkout does not fetch.
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tox
        run: python -m pip install tox

      - name: Run mypy
        run: tox -e ${{ matrix.tox-env }}

  build:
    runs-on: ubuntu-latest
    needs:
      - tests
      - interop
      - lint
      - mypy
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # setuptools-scm derives the version from tags, which a shallow
          # checkout does not fetch.
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tox
        run: python -m pip install tox

      - name: Build release artifacts
        run: tox -e release

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  publish:
    runs-on: ubuntu-latest
    needs:
      - build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
